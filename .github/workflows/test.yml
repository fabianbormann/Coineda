name: Run Tests
on:
  push:
    branches-ignore:
      - 'main'
  pull_request:
    branches-ignore:
      - 'main'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🫡 Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 🧘‍♀️ Download dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 💅 Check formatting
        run: npm run format:check

      - name: 🧮 Typecheck
        run: npx tsc --noEmit

      - name: 🎳 Run tests
        run: npx vitest run
