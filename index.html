<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- SVG first: browsers that understand it get a mark that stays crisp
         at any size and costs 11 KB, and skip the .ico entirely. The .ico
         stays as the legacy fallback, now carrying real 16/32/48/64 frames
         instead of the single 192x192 one it used to, which every tab strip
         had to downscale. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The header's own colour, so the address bar and the app read as one
         surface (src/components/theme/themeColor.ts). Two, so the right one
         applies before any script runs; ThemeProvider then points both at
         the theme actually in use, which may not be the system's. -->
    <meta
      name="theme-color"
      content="#f7f7fa"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#17181c"
      media="(prefers-color-scheme: dark)"
    />
    <!-- No Referer on provider requests. The Origin header on CORS fetches
         cannot be suppressed; see SECURITY.md. -->
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Coineda — a free, open source, local-running crypto tracking and tax tool"
    />
    <!-- The full-bleed variant, not the rounded tile: iOS ignores alpha on a
         home-screen icon and fills transparency with black, so the tile's
         transparent corners would come back as black ones. iOS rounds it
         itself. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Coineda</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="./theme-init.js"></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
